name: CI

# Every push to any branch, which covers a pull request from this repository.
# A pull request from a fork runs on the pull_request event instead; the jobs
# skip it for one from this repository, which its push already ran.
on:
  push:
  pull_request:
  workflow_call:
    inputs:
      version:
        description: Version embedded in a release binary
        type: string
        default: ''

env:
  ZANE_CLI_VERSION: ${{ inputs.version || '' }}

permissions:
  contents: read

jobs:
  installers:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Devbox tools (latest Devbox CLI)
        uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        with:
          enable-cache: true
      - run: devbox run -- bash test/install.sh
      - run: devbox run -- bash test/release-tag.sh
      - run: devbox run -- shellcheck install.sh test/install.sh .github/scripts/release-tag.sh test/release-tag.sh

  # Alpine, because only musl links a fully static binary.
  linux:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    # Devbox/Nix targets glibc, while this release must remain fully static.
    # update-tools.yml tracks this explicit stable Crystal image version.
    container: crystallang/crystal:1.22.0-alpine
    steps:
      - run: apk add --no-cache git just g++ file
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - run: just fmt-check
      - run: just test
      - run: just release
      - name: The binary links nothing dynamically
        run: |
          file build/zane
          file build/zane | grep -Eq 'statically linked|static-pie linked'
      - run: build/zane --version
      - name: Check the release version
        if: inputs.version != ''
        run: test "$(build/zane --version)" = "zane $ZANE_CLI_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zane-linux-x86_64
          path: build/zane

  macos:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Install Devbox tools (latest Devbox CLI)
        uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        with:
          enable-cache: true
      - run: devbox run -- bash test/install.sh
      - run: devbox run -- just test
      - run: devbox run -- just release
      - name: Check the architecture
        run: test "$(uname -m)" = arm64
      - name: The binary links only system libraries
        run: |
          otool -L build/zane
          ! otool -L build/zane | tail -n +2 | grep -v -e '^\s*/usr/lib/' -e '^\s*/System/'
      - run: build/zane --version
      - name: Check the release version
        if: inputs.version != ''
        run: test "$(build/zane --version)" = "zane $ZANE_CLI_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zane-macos-arm64
          path: build/zane

  # Devbox supports Windows through WSL only. Keep real Windows/MSVC builds
  # and PowerShell installer tests; WSL would test the Linux target instead.
  windows:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - uses: crystal-lang/install-crystal@46e48b6238ee23b1a6ef08ec39f12fb234676006 # v1.9.3
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Test the Windows installer
        shell: pwsh
        run: ./test/install.ps1
      - name: Test the installer with Windows PowerShell 5.1
        shell: powershell
        run: ./test/install.ps1
      - run: just test
      - run: just release
      - run: build/zane.exe --version
      - name: Check the release version
        if: inputs.version != ''
        run: test "$(build/zane.exe --version)" = "zane $ZANE_CLI_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zane-windows-x86_64
          path: build/zane.exe
